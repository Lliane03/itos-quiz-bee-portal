<!DOCTYPE html>

<style>
:root{--navy:#0b1f4a;--navy2:#13306b;--gold:#f5b301;--maroon:#8b0000;--bg:#f3f5fa;--card:#fff;--ink:#16203a;--mute:#5b6682;--line:#dde2ee;--ok:#12803c;--okbg:#e6f6ec;--bad:#b3261e;--badbg:#fdeceb;--warn:#b26a00}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;font-size:15px}
.qlayout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px;align-items:start}
.qlayout aside{position:sticky;top:70px}
.qlayout .pal{grid-template-columns:repeat(5,1fr)}
@media (max-width:820px){.qlayout{grid-template-columns:1fr}.qlayout aside{position:static}.qlayout .pal{grid-template-columns:repeat(auto-fill,minmax(38px,1fr))}}
header.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:13px 16px;border-bottom:3px solid var(--gold)}
header.top .in{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{margin:0;font-size:1.2rem}
header.top small{font-size:.78rem}

header.top small{opacity:.8;display:block;font-weight:400}
main{max-width:1000px;margin:16px auto;padding:0 14px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(10,20,50,.05)}
h2{margin:0 0 10px;font-size:1rem;color:var(--navy)}
.grid{display:grid;gap:8px}
.scopes{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;background:#fff;user-select:none}
.opt:hover{border-color:var(--navy2)}
.opt.on{border-color:var(--navy2);background:#eef2fc}
.opt input{accent-color:var(--navy2);width:17px;height:17px;flex:none}
.opt .n{margin-left:auto;font-size:.75rem;color:var(--mute);white-space:nowrap}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.seg{display:grid;gap:8px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--navy2);background:#fff;color:var(--navy2);padding:9px 16px;font-weight:600}
button:hover{background:#eef2fc}
button.pri{background:var(--navy2);color:#fff}
button.pri:hover{background:var(--navy)}
button.gold{background:var(--gold);border-color:var(--gold);color:#241a00}
button.gold:hover{background:#e2a500}

.big{padding:13px 26px;font-size:1.05rem}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.links button{padding:5px 11px;font-size:.82rem}
.muted{color:var(--mute);font-size:.88rem}
.note{background:#fff7e0;border:1px solid #f0d98a;color:#6b4e00;border-radius:10px;padding:9px 12px;font-size:.88rem;margin-bottom:12px}
/* quiz */
.qbar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;border-radius:0 0 12px 12px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:-18px -14px 14px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem}
.timer.low{color:#ff8a80}
.qbar button{padding:6px 14px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:.74rem;padding:2px 9px;border-radius:99px;background:#eef2fc;color:var(--navy2);font-weight:600}
.tag.E{background:#e6f6ec;color:var(--ok)}.tag.A{background:#fff3d6;color:var(--warn)}.tag.D{background:#fdeceb;color:var(--bad)}
.qtext{font-size:1.12rem;font-weight:600;margin:4px 0 14px}
.choice{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:8px;cursor:pointer}
.choice:hover{border-color:var(--navy2)}
.choice.sel{border-color:var(--navy2);background:#eef2fc}
.choice b{background:var(--navy2);color:#fff;border-radius:6px;min-width:26px;text-align:center;padding:0 4px;flex:none}
input.ans{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border:1.5px solid var(--navy2);border-radius:10px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pal button{padding:6px 0;font-size:.85rem;border-width:1px}
.pal .done{background:#dbe6ff}.pal .flag{outline:2px solid var(--gold)}.pal .cur{background:var(--navy2);color:#fff}
/* results */
.score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:800;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;flex:1;min-width:260px}
.stat{border-radius:10px;padding:10px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:1.6rem}
.stat.g{background:var(--okbg);color:var(--ok)}.stat.r{background:var(--badbg);color:var(--bad)}.stat.y{background:#fff3d6;color:var(--warn)}.stat.b{background:#eef2fc;color:var(--navy2)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600}
.bar{height:8px;background:#e8ecf6;border-radius:5px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--ok)}
.rev{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff;break-inside:avoid}
.rev.ok{border-left-color:var(--ok)}.rev.no{border-left-color:var(--bad)}.rev.na{border-left-color:var(--warn)}
.rev .q{font-weight:600;margin:6px 0}
.line{font-size:.92rem;margin:3px 0}
.good{color:var(--ok);font-weight:600}.badc{color:var(--bad);font-weight:600}
.exp{background:#f5f7fc;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:.9rem}
.ch{font-size:.9rem;padding:2px 8px;border-radius:6px;display:inline-block;margin:2px 6px 2px 0;border:1px solid var(--line)}
.ch.c{background:var(--okbg);border-color:var(--ok)}.ch.w{background:var(--badbg);border-color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters button.act{background:var(--navy2);color:#fff}
.printhead{display:none}
details summary{cursor:pointer;font-weight:600;color:var(--navy2)}
textarea{width:100%;min-height:90px;font:12px monospace}
@media (max-width:600px){.qtext{font-size:1.08rem}.ring{width:100px;height:100px;font-size:1.5rem}}
@media print{
  body{background:#fff}header.top,.noprint,.filters,.qbar{display:none!important}
  main{max-width:none;margin:0;padding:0}.card{box-shadow:none;border:none;padding:0}
  .printhead{display:block;border-bottom:2px solid var(--navy);margin-bottom:10px;padding-bottom:6px}
  .rev{page-break-inside:avoid}.ring{background:none!important;border:3px solid var(--navy)}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
[data-theme=dark]{--bg:#0a1020;--card:#141b30;--ink:#e6ebf8;--mute:#9aa7c7;--line:#27304f;--okbg:#0f2a1b;--badbg:#321514;--navy2:#5b86e5;--ok:#4cc27a;--bad:#ff8a80;--warn:#f0b24a}
[data-theme=dark] .opt,[data-theme=dark] button,[data-theme=dark] .choice,[data-theme=dark] .rev,[data-theme=dark] input.ans,[data-theme=dark] textarea{background:var(--card);color:var(--ink)}
[data-theme=dark] button.pri,[data-theme=dark] .filters button.act,[data-theme=dark] .pal .cur{background:var(--navy2);color:#fff}[data-theme=dark] button.gold{background:var(--gold);color:#241a00}
[data-theme=dark] .opt.on,[data-theme=dark] .choice.sel,[data-theme=dark] .tag,[data-theme=dark] .exp,[data-theme=dark] .pal .done{background:#1c2a52}
[data-theme=dark] h2,[data-theme=dark] details summary{color:#9db8ff}[data-theme=dark] .ring>div{background:var(--card)!important}
[data-theme=dark] .note{background:#2b2410;border-color:#5b4a14;color:#f0d98a}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.mode:hover{border-color:var(--gold);transform:translateY(-2px)}.mode b{font-size:1.1rem;color:var(--navy2)}.mode span{font-size:.88rem;color:var(--mute)}
@media print{.modes{display:none}}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.sc{position:relative;display:flex;flex-direction:column;gap:4px;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:var(--card);overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.sc::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c);opacity:.35}
.sc:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(10,20,50,.1)}.sc:focus-within{outline:3px solid var(--gold)}
.sc.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--card))}.sc.on::before{opacity:1}
.sc input{position:absolute;opacity:0;pointer-events:none}
.sc .ck{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff;font-weight:800}
.sc.on .ck{background:var(--c);border-color:var(--c)}.sc.on .ck::after{content:"\2713"}
.sc .ic{font-size:1.7rem;line-height:1}.sc .no{font-size:.7rem;font-weight:800;letter-spacing:.06em;color:var(--c);margin-top:4px}
.sc .nm{font-weight:700;font-size:.93rem;line-height:1.25;min-height:2.3em}
.sc .meta{display:flex;justify-content:space-between;font-size:.76rem;color:var(--mute);margin-top:2px}
.sc .mb{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.sc .mb i{display:block;height:100%;background:var(--c)}
.pal{gap:7px}.pal button{aspect-ratio:1;padding:0;border-width:1.5px;border-radius:10px;font-weight:700;font-size:.85rem;position:relative;background:var(--card);color:var(--mute);border-color:var(--line)}
.pal button:hover{border-color:var(--navy2);color:var(--navy2)}
.pal .done,[data-theme=dark] .pal .done{background:var(--navy2);border-color:var(--navy2);color:#fff}
.pal .flag{outline:none}.pal .flag::after{content:"";position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--card)}
.pal .cur,[data-theme=dark] .pal .cur{background:var(--navy);border-color:var(--navy);color:#fff;outline:3px solid var(--gold);outline-offset:1px}
.pal.locked button{pointer-events:none}
.mpb{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.mpb i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--ok))}
.mpt{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute);margin:6px 0 12px}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:14px;font-size:.74rem;color:var(--mute)}.lg span{display:flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);display:inline-block;position:relative}.sw.dn{background:var(--navy2);border-color:var(--navy2)}
.sw.cur{background:var(--navy);outline:2px solid var(--gold);outline-offset:0}.sw.fl::after{content:"";position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.ft{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#cfd8f3;border-top:3px solid var(--gold);padding:20px 16px;margin-top:20px;font-size:.85rem}
.ft .in{max-width:980px;margin:auto;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}.ft b{color:#fff}
.ft a{color:#fff;margin-left:14px;text-decoration:underline}.ft .cp{width:100%;opacity:.75;font-size:.78rem;border-top:1px solid rgba(255,255,255,.2);padding-top:10px}
.sc.static{cursor:default}.sc.static:hover{transform:none;box-shadow:none}.big2{font-size:1.8rem;font-weight:800;line-height:1.1}.pgs .sc{gap:2px}
.rc .nm{min-height:0}.rc .meta{justify-content:flex-start}
.startc{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:none;padding:22px 16px}
.startc .sum{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.startc .chip{background:rgba(255,255,255,.15);border-radius:99px;padding:4px 12px;font-size:.82rem;font-weight:600}
.startc .go{padding:14px 44px;font-size:1.1rem;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}.startc .wk{font-size:.85rem;opacity:.9}
[hidden]{display:none!important}
.hintbtn{padding:5px 12px;font-size:.82rem;border-radius:99px;margin-left:auto}
.hintbox{background:#fff8dc;border:1.5px solid #f2d36b;color:#5a4300;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.92rem}
[data-theme=dark] .hintbox{background:#2b2410;border-color:#5b4a14;color:#f0d98a}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;border-left:5px solid}.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.no{background:var(--badbg);border-color:var(--bad)}
.sc.static.click{cursor:pointer}.sc.static.click:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(10,20,50,.12)}
.mb-back{position:fixed;inset:0;background:rgba(5,10,30,.6);display:grid;place-items:center;z-index:50;padding:14px}
.mb{background:var(--card);color:var(--ink);border-radius:16px;max-width:880px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mbh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.mbb{overflow:auto;padding:6px 18px 16px}
.ico{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;border-radius:8px}.ico.del{color:var(--bad)}.ico:disabled{opacity:.35}
.pal .right,[data-theme=dark] .pal .right{background:var(--ok);border-color:var(--ok);color:#fff}
.pal .wrong,[data-theme=dark] .pal .wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.sw.ok{background:var(--ok);border-color:var(--ok)}.sw.bad{background:var(--bad);border-color:var(--bad)}
@media print{.mb-back{display:none}}
</style>

/* ===================== TEST GENERATION ===================== */
function pickQuestions(pool,n,diff){
  let out=[],note="";
  if(diff==="Mixed"){
    const g={Easy:shuffle(pool.filter(q=>q.difficulty==="Easy")),Average:shuffle(pool.filter(q=>q.difficulty==="Average")),Difficult:shuffle(pool.filter(q=>q.difficulty==="Difficult"))};
    const order=["Easy","Average","Difficult"];let i=0,guard=0;
    while(out.length<n&&guard++<5000){const k=order[i%3];if(g[k].length)out.push(g[k].shift());i++;if(order.every(o=>!g[o].length))break}
  }else{
    const m=shuffle(pool.filter(q=>q.difficulty===diff));out=m.slice(0,n);
    if(out.length<n){const rest=shuffle(pool.filter(q=>q.difficulty!==diff));
      note=`Only ${m.length} ${diff} question(s) exist in the selected scopes, so the rest were topped up with other difficulties.`;out=out.concat(rest.slice(0,n-out.length))}
  }
  return {items:shuffle(out),note};
}
function buildItem(q,format){
  const it={id:q.id,scope:q.scope,difficulty:q.difficulty,question:q.question,answer:q.answer,aliases:q.aliases||[],explanation:q.explanation||"",hint:q.hint||"",hinted:false,format,user:null,flag:false};
  if(format==="MC"){
    const d=shuffle((q.distractors||[]).filter(x=>norm(x)!==norm(q.answer))).slice(0,3);
    it.choices=shuffle([q.answer].concat(d));
  }
  return it;
}
function startFromSetup(){
  const pool=allQuestions().filter(q=>setup.scopes.includes(q.scope));
  if(!pool.length)return;
  const d=setup.difficulty,cnt=d==="Mixed"?pool.length:pool.filter(q=>q.difficulty===d).length;
  const r=cnt?pickQuestions(pool,cnt,d):pickQuestions(pool,pool.length,"Mixed");
  let note=cnt?r.note:"No "+d+" questions exist in the selected scopes, so all difficulties are included.";
  launch(r.items,Object.assign({},setup),note,"Standard");
}
function launch(qs,opts,note,mode){
  T={opts,mode,note,items:qs.map(q=>buildItem(q,opts.format)),idx:0,start:Date.now(),deadline:opts.timer?Date.now()+opts.timer*60000:0,submitted:false};
  renderQuiz();

}

}

/* ===================== SUBMIT & RESULTS ===================== */
function submitTest(auto){
  if(!T||T.submitted)return;
  T.submitted=true;clearInterval(tick);T.end=Date.now();T.auto=auto;
  T.items.forEach(it=>it.ok=isCorrect(it));
  // update weak list
  let weak=new Set(lsGet(WEAK_KEY,[]));
  T.items.forEach(it=>{if(it.ok)weak.delete(it.id);else weak.add(it.id)});
  lsSet(WEAK_KEY,Array.from(weak));
  T.filter="all";renderResults();window.scrollTo(0,0);
}

  const n=T.items.length,ok=T.items.filter(x=>x.ok).length,na=T.items.filter(x=>x.user==null||x.user==="").length,bad=n-ok-na;

  const by={};T.items.forEach(it=>{const b=by[it.scope]||(by[it.scope]={t:0,c:0});b.t++;if(it.ok)b.c++});
  const byd={Easy:{t:0,c:0},Average:{t:0,c:0},Difficult:{t:0,c:0}};T.items.forEach(it=>{byd[it.difficulty].t++;if(it.ok)byd[it.difficulty].c++});
  const col=pct>=75?"var(--ok)":pct>=50?"var(--gold)":"var(--bad)";
  const msg=pct>=90?"Outstanding!":pct>=75?"Strong result. Keep sharpening the weak spots.":pct>=50?"Decent. Use Try Again to drill your misses.":"Keep going. Review the explanations, then Try Again.";
  const rows=T.items.map((it,i)=>({it,i})).filter(({it})=>T.filter==="all"||(T.filter==="wrong"&&!it.ok)||(T.filter==="right"&&it.ok)||(T.filter==="flag"&&it.flag));
  $("#app").innerHTML=`
  <div class="printhead"><h2 style="margin:0">IT Skills Olympics · Quiz Bee Practice Result</h2>
    <div class="muted">${new Date(T.end).toLocaleString()} · ${T.opts.format==="MC"?"Multiple Choice":"Identification"} · ${esc(T.opts.difficulty)} · ${T.opts.timer?T.opts.timer+" min timer":"No timer"} · Score ${ok}/${n} (${pct}%)</div></div>

    <div class="score"><div class="ring" style="background:conic-gradient(${col} ${pct*3.6}deg,#e8ecf6 0)"><div style="background:#fff;border-radius:50%;width:78%;height:78%;display:grid;place-items:center">${pct}%</div></div>
    <div class="stats"><div class="stat b"><b>${ok} / ${n}</b>Total score</div><div class="stat g"><b>${ok}</b>Correct</div><div class="stat r"><b>${bad}</b>Incorrect</div><div class="stat y"><b>${na}</b>Unanswered</div><div class="stat b"><b>${fmt(used)}</b>Time used${T.auto?" (time up)":""}</div></div></div>
    <p class="muted" style="margin-bottom:0">${msg}</p>
    <div class="links noprint" style="margin-top:12px"><button class="gold" onclick="tryAgain()" ${ok===n?"disabled":""}>↻ Try Again (focus on weak items)</button><button class="pri" onclick="exportPDF()">⬇ Export PDF</button><button onclick="renderSetup()">New quiz</button></div>
    ${ok===n?`<div class="muted noprint">Perfect score. Nothing to retry.</div>`:""}</div>
  <div class="card"><h2>Breakdown by scope</h2><table><tr><th>Scope</th><th>Score</th><th style="width:30%">Accuracy</th></tr>
    ${Object.keys(by).map(k=>{const b=by[k],p=Math.round(b.c/b.t*100);return `<tr><td>${esc(scopeName(+k))}</td><td>${b.c}/${b.t}</td><td><div class="bar"><i style="width:${p}%;background:${p>=75?"var(--ok)":p>=50?"var(--gold)":"var(--bad)"}"></i></div></td></tr>`}).join("")}</table>
    <table style="margin-top:12px"><tr><th>Difficulty</th><th>Score</th></tr>${Object.keys(byd).filter(k=>byd[k].t).map(k=>`<tr><td>${k}</td><td>${byd[k].c}/${byd[k].t}</td></tr>`).join("")}</table></div>
  <div class="card"><h2>Detailed review</h2>
    <div class="filters">${[["all","All ("+n+")"],["wrong","Incorrect/unanswered ("+(bad+na)+")"],["right","Correct ("+ok+")"],["flag","Flagged ("+T.items.filter(x=>x.flag).length+")"]].map(f=>`<button class="${T.filter===f[0]?"act":""}" onclick="setFilter('${f[0]}')">${f[1]}</button>`).join("")}</div>
    ${rows.map(({it,i})=>reviewItem(it,i)).join("")||'<div class="muted">Nothing to show for this filter.</div>'}</div>`;
}
function reviewItem(it,i){
  const unans=it.user==null||it.user==="";
  const cls=it.ok?"ok":unans?"na":"no";
  let mid="";
  if(it.format==="MC"){
    mid=`<div>${it.choices.map((c,k)=>`<span class="ch ${c===it.answer?"c":c===it.user?"w":""}">${"ABCD"[k]}. ${esc(c)}${c===it.user?" ← yours":""}${c===it.answer?" ✓":""}</span>`).join("")}</div>`;
  }else{
    mid=`<div class="line">Your answer: <span class="${it.ok?"good":"badc"}">${unans?"(no answer)":esc(it.user)}</span></div>
         <div class="line">Correct answer: <span class="good">${esc(it.answer)}</span>${it.aliases.length?` <span class="muted">(also accepted: ${esc(it.aliases.join(", "))})</span>`:""}</div>`;
  }
  return `<div class="rev ${cls}"><div class="qmeta"><span class="tag">#${i+1}</span><span class="tag">${esc(scopeName(it.scope))}</span><span class="tag ${it.difficulty[0]}">${it.difficulty}</span><span class="tag" style="background:${it.ok?"var(--okbg)":unans?"#fff3d6":"var(--badbg)"}">${it.ok?"Correct":unans?"Unanswered":"Incorrect"}</span>${it.flag?'<span class="tag">★ flagged</span>':""}</div>
    <div class="q">${esc(it.question)}</div>${mid}
    ${it.format==="MC"&&!it.ok?`<div class="line">Correct answer: <span class="good">${esc(it.answer)}</span></div>`:""}
    <div class="exp"><b>Why:</b> ${esc(it.explanation||"—")}</div></div>`;
}

/* ===================== TRY AGAIN (weak-focus) ===================== */
function tryAgain(){
  const all=allQuestions(),byId=new Map(all.map(q=>[q.id,q]));
  const missed=T.items.filter(x=>!x.ok).map(x=>byId.get(x.id)).filter(Boolean);
  const seen=new Set(T.items.map(x=>x.id));
  const scopes=T.opts.scopes;
  const missedIds=new Set(missed.map(q=>q.id));
  const storedWeak=lsGet(WEAK_KEY,[]).map(id=>byId.get(id)).filter(q=>q&&scopes.includes(q.scope)&&!missedIds.has(q.id));
  // weak scopes first when topping up
  const bySc={};T.items.forEach(it=>{const b=bySc[it.scope]||(bySc[it.scope]={t:0,c:0});b.t++;if(it.ok)b.c++});
  const rank=s=>{const b=bySc[s];return b?b.c/b.t:1};
  const unseen=all.filter(q=>scopes.includes(q.scope)&&!seen.has(q.id)&&!missedIds.has(q.id)&&!storedWeak.includes(q));
  const fresh=shuffle(unseen).sort((a,b)=>rank(a.scope)-rank(b.scope));
  let list=shuffle(missed).concat(shuffle(storedWeak)).concat(fresh);
  // if still short, reuse correct items from the previous test
  const cap=T.items.length;if(list.length<cap){const got=new Set(list.map(q=>q.id));list=list.concat(shuffle(all.filter(q=>scopes.includes(q.scope)&&!got.has(q.id))))}
  list=list.slice(0,cap);
  const nm=Math.min(missed.length,cap);
  const note=`Weak-focus test: the first ${nm} item(s) are the ones you missed or left blank last time, shuffled in with new questions from your selected scopes (weakest scopes first).`;
  launch(shuffle(list),Object.assign({},T.opts),note,"Try Again");
}

function importJSON(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{
    const msg=$("#impmsg");
    try{
      const data=JSON.parse(r.result),qs=Array.isArray(data)?data:data.questions;
      if(!Array.isArray(qs))throw new Error("No 'questions' array found.");
      let added=0,skipped=0;const ids=new Set(allQuestions().map(q=>q.id));
      qs.forEach((q,i)=>{
        const sc=+q.scope,diff=["Easy","Average","Difficult"].includes(q.difficulty)?q.difficulty:null;
        if(!q.question||!q.answer||!sc||!diff||!Array.isArray(q.distractors)||q.distractors.length<3){skipped++;return}
        let id=q.id||("imp-"+Date.now()+"-"+i);while(ids.has(id))id+="x";ids.add(id);
        custom.push({id,scope:sc,difficulty:diff,question:String(q.question),answer:String(q.answer),aliases:(q.aliases||[]).map(String),distractors:q.distractors.map(String),explanation:String(q.explanation||"")});added++;
      });
      lsSet(CUSTOM_KEY,custom);
      renderSetup();$("#impmsg").textContent=`Imported ${added} question(s)${skipped?`, skipped ${skipped} invalid (need question, answer, scope, difficulty and 3 distractors)`:""}.`;
      $(".card.noprint details").open=true;
    }catch(e){msg.textContent="Import failed: "+e.message}
  };
  r.readAsText(f);
}

function hintFor(it){if(it.hint)return it.hint;const a=String(it.answer).replace(/`/g,"").trim(),w=a.split(/\s+/).filter(Boolean).length,l=a.replace(/[^A-Za-z0-9]/g,"").length,f=(a.match(/[A-Za-z0-9]/)||["?"])[0].toUpperCase();

function checkFinals(auto){if(!T||T.submitted)return;const it=T.items[T.idx];if(it.checked)return;
  if(!auto&&!it.user&&T.mode!=="Finals"){const a=$("#ans");if(a)a.focus();return}
  it.checked=true;it.ok=isCorrect(it);T.fb=true;renderQuiz();const me=T;
  me.fbT=setTimeout(()=>{if(T!==me||me.submitted)return;me.fb=false;if(me.idx===me.items.length-1)submitTest(false);else go(1)},it.ok?2200:4200)}
